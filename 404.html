<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sayfa bulunamadı · Rota DMC</title>
<link rel="icon" href="/rota-dmc/ikon.svg" type="image/svg+xml">
<script src="/_ortak/serit.js" defer></script>
<style>
:root{--brand:#ff0054;--ink:#15111a;--muted:#5d5866;--line:rgba(26,16,30,.12)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 24px;background:radial-gradient(50% 40% at 50% 0%,rgba(255,0,84,.12),transparent 70%),#fff;color:var(--ink);font:16px/1.6 "Inter","Segoe UI",system-ui,-apple-system,sans-serif;text-align:center}
main{max-width:520px}
img{width:52px;height:52px;border-radius:14px;margin:0 auto}
small{display:block;margin-top:26px;font:500 12px/1 ui-monospace,Consolas,monospace;letter-spacing:.14em;color:#d10046}
h1{margin:12px 0 0;font-size:clamp(30px,6vw,42px);line-height:1.1;letter-spacing:-.035em}
p{color:var(--muted);margin:14px 0 0}
.eylem{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px}
a.btn{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 20px;border-radius:13px;font-weight:600;text-decoration:none;border:1px solid var(--line);color:var(--ink);background:#fff}
a.btn.ana{border:0;color:#fff;background:linear-gradient(135deg,#ff0054,#c40042);box-shadow:0 12px 30px -10px rgba(255,0,84,.6)}
a:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
@media (max-width:480px){.eylem{flex-direction:column}a.btn{width:100%}}
</style>
</head>
<body>
<main>
  <img src="/rota-dmc/ikon.svg" alt="" width="52" height="52">
  <small>404</small>
  <h1>Bu sayfa bulunamadı.</h1>
  <p>Aradığınız adres taşınmış ya da hiç var olmamış olabilir. Rota DMC tanıtımına ya da canlı uygulamaya buradan devam edin.</p>
  <div class="eylem">
    <a class="btn ana" href="/rota-dmc/">Rota DMC tanıtımı</a>
    <a class="btn" href="/rota-dmc/uygulama/">Uygulamayı aç</a>
  </div>
</main>
</body>
</html>
